[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mp-profile"
version = "0.1.0"
description = "Strands agent that summarises what an Australian federal or Victorian MP said about housing, healthcare, economy and education across their career."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents==1.57.0",
    "strands-agents-evals==1.4.0",
    "mcp>=2.1,<2.2",
    "httpx>=0.28,<1",
    "lxml>=6.0,<7",
    "pydantic>=2.4,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.3,<2", "ruff>=0.15", "mypy>=1.15", "lxml-stubs>=0.5"]

[project.scripts]
mp-profile = "mp_profile.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mp_profile"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["agent.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
packages = ["mp_profile"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["strands_evals.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
